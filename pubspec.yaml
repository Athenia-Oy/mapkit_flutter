name: mapkit_flutter
description: "MapKit for Flutter — MKMapView on iOS and macOS with Apple's exact symbol names: annotations, clustering, overlays, tile overlays, Look Around, snapshots, mockable controller."
version: 0.5.1
repository: https://github.com/esenmx/mapkit_flutter
issue_tracker: https://github.com/esenmx/mapkit_flutter/issues
topics:
  - map
  - ios
  - macos
  - apple
  - flutter-plugin

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.17.0
dev_dependencies:
  api_summary: ^1.2.0
  build_runner: ^2.16.2
  checks: ^0.3.2
  # Floor for `pub downgrade`: api_summary's analyzer reaches glob 2.0.0, whose
  # file 6.0.0 doesn't compile against Dart 3's dart:io.
  file: ^7.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.8.1
  pigeon: 29.0.10
  very_good_analysis: ^11.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: MapKitPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: MapKitPlugin
        sharedDarwinSource: true
